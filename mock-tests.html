<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mock Tests — IBA DU Mock Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="main.css" />
<style>
  .page-header { padding: 44px 0 28px; }
  .page-header h1 { font-size: 28px; margin-bottom: 6px; }
  .page-header p { color: var(--text-muted); font-size: 14px; margin: 0; }

  .test-list { display: flex; flex-direction: column; gap: 14px; padding-bottom: 60px; }
  .test-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 20px 22px; flex-wrap: wrap;
  }
  .test-row .meta { flex: 1; min-width: 220px; }
  .test-row h3 { font-size: 16px; margin-bottom: 4px; }
  .test-row p { font-size: 13px; color: var(--text-muted); margin: 0; max-width: 480px; }
  .test-row .tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="navbar-mount"></div>

<main class="container">
  <div class="page-header">
    <h1>Mock Tests</h1>
    <p>Full-length, timed practice tests structured exactly like the real IBA DU admission exam.</p>
  </div>

  <div id="testList" class="test-list">
    <div class="state-block">
      <div class="spinner" style="margin:0 auto;"></div>
    </div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="scoring.js"></script>
<script src="api.js"></script>
<script src="shared.js"></script>
<script>
(async function () {
  renderNavbar("mock-tests");
  renderFooter();

  const listEl = document.getElementById("testList");

  async function load() {
    try {
      const tests = await Api.listTests();

      if (tests.length === 0) {
        listEl.innerHTML = `
          <div class="state-block card">
            <h3>No mock tests available yet</h3>
            <p>Check back soon — new tests are added regularly.</p>
          </div>`;
        return;
      }

      // total question count per test, for the badge
      const counts = await Promise.all(
        tests.map((t) =>
          sb
            .from("questions")
            .select("id", { count: "exact", head: true })
            .eq("test_id", t.id)
            .then((r) => r.count || 0)
            .catch(() => 0)
        )
      );

      listEl.innerHTML = tests
        .map(
          (t, i) => `
        <div class="card card-hover test-row">
          <div class="meta">
            <h3>${escapeHtml(t.title)}</h3>
            <p>${escapeHtml(t.description)}</p>
            <div class="tags">
              <span class="badge badge-accent">${counts[i]} Questions</span>
              <span class="badge badge-neutral">${t.duration_minutes} min</span>
              <span class="badge badge-neutral">Test ${t.test_number}</span>
              ${!t.is_public ? `<span class="badge badge-warning">Restricted access</span>` : ""}
            </div>
          </div>
          <a href="mock-test-start.html?testId=${encodeURIComponent(t.id)}" class="btn btn-primary">View test</a>
        </div>
      `
        )
        .join("");
    } catch (err) {
      listEl.innerHTML = `
        <div class="state-block card">
          <h3>Failed to load mock tests</h3>
          <p>${escapeHtml(err.message)}</p>
          <button class="btn btn-secondary" onclick="location.reload()">Retry</button>
        </div>`;
    }
  }

  load();
})();
</script>
</body>
</html>
