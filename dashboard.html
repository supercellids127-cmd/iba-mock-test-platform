<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — IBA DU Mock Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="main.css" />
<style>
  .page-header { padding: 40px 0 8px; }
  .page-header h1 { font-size: 24px; }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 24px 0; }
  .stat-card { padding: 18px; }
  .stat-card .n { font-size: 24px; font-weight: 800; }
  .stat-card .l { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  @media (max-width: 700px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }

  .cta-card { display: flex; align-items: center; justify-content: space-between; padding: 24px; background: var(--navy); color: var(--white); border-radius: var(--radius); margin-bottom: 28px; flex-wrap: wrap; gap: 14px; }
  .cta-card h3 { color: var(--white); font-size: 17px; margin-bottom: 4px; }
  .cta-card p { color: #94A3B8; font-size: 13px; margin: 0; }

  .recent-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .recent-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="navbar-mount"></div>

<main class="container">
  <div class="page-header">
    <h1 id="welcomeMsg">Welcome back</h1>
    <p class="text-muted" style="font-size:14px;">Here's how your preparation is going.</p>
  </div>

  <div class="cta-card">
    <div>
      <h3>Ready for another round?</h3>
      <p>Keep your momentum going with a fresh mock test.</p>
    </div>
    <a href="mock-tests.html" class="btn btn-primary">Take a mock test</a>
  </div>

  <div class="flex justify-between items-center mb-16">
    <span></span>
    <a href="results-list.html" style="font-size:13px; font-weight:600; color:var(--accent);">View all attempts →</a>
  </div>

  <div id="content">
    <div class="state-block"><div class="spinner" style="margin:0 auto;"></div></div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="scoring.js"></script>
<script src="api.js"></script>
<script src="shared.js"></script>
<script>
(async function () {
  const user = await requireStudent();
  if (!user) return;

  renderNavbar();
  renderFooter();

  const profile = await Api.getCurrentProfile();
  document.getElementById("welcomeMsg").textContent = `Welcome back, ${(profile && (profile.name || profile.student_id)) || "student"}`;

  const contentEl = document.getElementById("content");

  try {
    const attempts = (await Api.listMyAttempts()).filter((a) => a.status === "SUBMITTED");

    if (attempts.length === 0) {
      contentEl.innerHTML = `
        <div class="state-block card">
          <h3>No attempts yet</h3>
          <p>Take your first mock test to start tracking your performance.</p>
          <a href="mock-tests.html" class="btn btn-primary">Browse mock tests</a>
        </div>`;
      return;
    }

    const tests = await Api.listTests();
    const testsById = new Map(tests.map((t) => [t.id, t]));

    const scores = attempts.map((a) => a.result.total_percentage);
    const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    const best = Math.max(...scores);
    const avgAccuracy = Math.round(
      attempts.reduce((sum, a) => sum + a.result.overall_accuracy, 0) / attempts.length
    );

    // Weakest topics across all attempts (simple aggregate)
    const topicAgg = {};
    attempts.forEach((a) => {
      a.result.topic_performance.forEach((t) => {
        if (!topicAgg[t.topic]) topicAgg[t.topic] = { correct: 0, total: 0 };
        topicAgg[t.topic].correct += t.correct;
        topicAgg[t.topic].total += t.total;
      });
    });
    const weakest = Object.entries(topicAgg)
      .map(([topic, s]) => ({ topic, pct: Math.round((s.correct / s.total) * 100) }))
      .sort((a, b) => a.pct - b.pct)
      .slice(0, 3);

    contentEl.innerHTML = `
      <div class="stat-row">
        <div class="card stat-card"><div class="n">${attempts.length}</div><div class="l">Tests completed</div></div>
        <div class="card stat-card"><div class="n">${avg}%</div><div class="l">Average score</div></div>
        <div class="card stat-card"><div class="n">${best}%</div><div class="l">Best score</div></div>
        <div class="card stat-card"><div class="n">${avgAccuracy}%</div><div class="l">Average accuracy</div></div>
      </div>

      <div style="display:grid; grid-template-columns: 1.4fr 1fr; gap:20px; margin-bottom:40px;" id="dashGrid">
        <div class="card">
          <h3 style="font-size:15px; margin-bottom:14px;">Recent attempts</h3>
          <div id="recentList"></div>
        </div>
        <div class="card">
          <h3 style="font-size:15px; margin-bottom:14px;">Areas to focus on</h3>
          <div id="weakList"></div>
        </div>
      </div>
    `;

    const grid = document.getElementById("dashGrid");
    if (window.innerWidth < 800) grid.style.gridTemplateColumns = "1fr";

    document.getElementById("recentList").innerHTML = attempts
      .slice(0, 5)
      .map((a) => {
        const test = testsById.get(a.test_id);
        return `
        <div class="recent-row">
          <div>
            <div style="font-size:13.5px; font-weight:600;">${escapeHtml(test ? test.title : a.test_id)}</div>
            <div style="font-size:12px; color:var(--text-muted);">${formatDate(a.submitted_at)}</div>
          </div>
          <a href="results.html?attemptId=${encodeURIComponent(a.id)}" style="font-size:13px; font-weight:700; color:var(--accent);">${a.result.total_percentage}%</a>
        </div>`;
      })
      .join("");

    document.getElementById("weakList").innerHTML =
      weakest.length > 0
        ? weakest
            .map(
              (w) => `
        <div class="recent-row">
          <div style="font-size:13.5px;">${escapeHtml(w.topic)}</div>
          <div style="font-size:13px; font-weight:700; color:var(--error);">${w.pct}%</div>
        </div>`
            )
            .join("")
        : `<p class="text-muted" style="font-size:13px;">Not enough data yet.</p>`;
  } catch (err) {
    contentEl.innerHTML = `<div class="state-block card"><h3>Failed to load dashboard</h3><p>${escapeHtml(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
