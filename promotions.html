<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Promotions — IBA DU Mock Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="main.css" />
<style>
  body { background: #FAF9F6; }
  .page-header { padding: 44px 0 8px; }
  .promo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-bottom: 60px; }
  @media (max-width: 800px) { .promo-grid { grid-template-columns: 1fr; } }
  .promo-card { overflow: hidden; }
  .promo-img { height: 130px; background: linear-gradient(135deg, #1e293b, #334155); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; letter-spacing: 0.05em; }
  .promo-body { padding: 18px; }
  .promo-body h3 { font-size: 15px; margin-bottom: 6px; }
  .promo-body p { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }
</style>
</head>
<body>

<div id="navbar-mount"></div>

<main class="container">
  <div class="page-header">
    <h1 style="font-size:26px;">Promotions</h1>
    <p class="text-muted" style="font-size:14px;">Sponsored resources from partners — clearly separate from platform content.</p>
    <span class="badge badge-warning mt-8">Sponsored content</span>
  </div>

  <div class="promo-grid mt-24" id="promoGrid"></div>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="shared.js"></script>
<script>
  renderNavbar("promotions");
  renderFooter();

  // PLACEHOLDER — replace with GET /api/promotions (admin-managed).
  const DEMO_PROMOS = [
    { title: "IBA Written Prep Book — 5th Edition", desc: "Comprehensive practice sets for the written portion of admission tests.", link: "#" },
    { title: "Live Weekend Math Workshop", desc: "Small-group sessions focused on speed and accuracy for quantitative sections.", link: "#" },
    { title: "One-on-one Mentorship", desc: "Personalized guidance from current IBA DU students.", link: "#" },
  ];

  document.getElementById("promoGrid").innerHTML = DEMO_PROMOS.map(
    (p) => `
    <div class="card promo-card">
      <div class="promo-img">SPONSORED</div>
      <div class="promo-body">
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.desc)}</p>
        <a href="${p.link}" class="btn btn-secondary btn-block">Learn more</a>
      </div>
    </div>`
  ).join("");
</script>
</body>
</html>
